name: Compilar app iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Instalar pods
        run: cd ios && pod install

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -workspace ios/Teleprompter.xcworkspace \
            -scheme Teleprompter \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*VisionCamera|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Teleprompter.app

      - name: Mostrar erros da compilação
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -200 build.log

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Teleprompter.app Payload/
          zip -qry Teleprompter.ipa Payload
          ls -lh Teleprompter.ipa

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teleprompter build ${{ github.run_number }}
          make_latest: true
          files: Teleprompter.ipa

      - name: Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
